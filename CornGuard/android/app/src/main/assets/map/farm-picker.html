<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Farm location</title>
  <link rel="icon" href="data:," />
  <!--
    My Farms pin picker (FarmLocationPickerFragment). Same bundled Leaflet and Bukidnon boundaries as
    outbreak-map.html. Tapping the map drops (or moves) the farm pin and reports it to the app through
    window.CornGuardFarmPicker.onPin(lat, lng); the app works out the barangay and decides whether the
    spot can be saved. The app can also place the pin (Use my location) with window.setPin(lat, lng).
  -->
  <link rel="stylesheet" href="leaflet/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    .leaflet-container { background: #f4f1ea; }
    .leaflet-touch .leaflet-bar a { width: 48px; height: 48px; line-height: 48px; font-size: 22px; }
    #hint {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1000;
      background: rgba(30, 30, 30, 0.88); color: #fff; font: 15px/1.3 sans-serif;
      padding: 10px 16px; border-radius: 20px; pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="hint">Tap the map where your farm is</div>
  <script src="leaflet/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: true }).setView([8.0, 125.1], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' +
        ' | Boundaries &copy; NAMRIA, PSA',
      maxZoom: 19
    }).addTo(map);

    // A green map pin with a small house, so it reads as "my farm" rather than a disease report.
    const FARM_ICON = L.divIcon({
      className: '',
      iconSize: [36, 46],
      iconAnchor: [18, 44],
      html:
        '<svg width="36" height="46" viewBox="0 0 36 46" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M18 45C18 45 3 27.5 3 17A15 15 0 0 1 33 17C33 27.5 18 45 18 45Z" fill="#2e7d32" stroke="#fff" stroke-width="2.5"/>' +
        '<path d="M10.5 18.5L18 12l7.5 6.5V25h-5v-4.5h-5V25h-5z" fill="#fff"/>' +
        '</svg>'
    });

    let pin = null;
    function placePin(lat, lng) {
      if (pin) pin.setLatLng([lat, lng]);
      else pin = L.marker([lat, lng], { icon: FARM_ICON }).addTo(map);
      document.getElementById('hint').style.display = 'none';
    }

    map.on('click', (e) => {
      placePin(e.latlng.lat, e.latlng.lng);
      if (window.CornGuardFarmPicker) window.CornGuardFarmPicker.onPin(e.latlng.lat, e.latlng.lng);
    });

    /** Called by the app (Use my location): place the pin there and zoom in. Does not call onPin. */
    window.setPin = function (lat, lng) {
      placePin(lat, lng);
      map.setView([lat, lng], Math.max(map.getZoom(), 15));
    };

    fetch('../geo/bukidnon-barangays.json')
      .then((r) => r.json())
      .then((geo) => {
        const layer = L.geoJSON(geo, {
          style: { color: '#334155', weight: 1, fillOpacity: 0, interactive: false }
        }).addTo(map);
        const bounds = layer.getBounds();
        if (bounds.isValid() && !pin) map.fitBounds(bounds, { padding: [8, 8] });
      })
      .catch((e) => console.error('Boundaries failed to load: ' + e))
      .finally(() => { if (window.CornGuardFarmPicker) window.CornGuardFarmPicker.onReady(); });
  </script>
</body>
</html>
