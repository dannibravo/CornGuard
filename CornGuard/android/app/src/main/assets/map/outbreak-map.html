<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CornGuard Outbreak Map</title>
  <link rel="icon" href="data:," />
  <!--
    Outbreak heatmap (UI redesign v2, "earth" palette). Loaded by MapFragment in a WebView.
      * Leaflet 1.9.4 and the NAMRIA/PSA barangay boundaries are bundled, so the map draws offline.
        Street tiles (OpenStreetMap) are only requested from TILE_MIN_ZOOM; the province view is
        boundaries only (no tile requests). Satellite (Esri) stays opt-in. Choice in localStorage.
        KEEP IN SYNC with BasemapToggle in admin-web/src/pages/MapPage.tsx.
      * Each barangay is coloured by its outbreak heat this week on a FIXED scale (backend
        outbreakRules.heatIntensity; heatOf() below is the fallback copy — KEEP IN SYNC): Moderate
        starts at 0.5 (2× its usual level), Severe at 0.8 (3×). Barangays still collecting data are
        hatched ("Not enough data yet"). A soft glow at each centroid keeps small barangays visible;
        overlapping glows take the maximum, never a sum.
      * Disease report markers are not drawn for farmers (heat + "Your farm" only).
      * Native bridge: window.updateMapData, setMapChrome, setBottomInset, setTheme,
        setDiseaseFilter, selectArea (MapFragment -> page); CornGuardMap.onReady and
        CornGuardMap.onAreaSelected (page -> MapFragment).
      * Location search (top-left): bundled boundary names only.
        KEEP IN SYNC with admin-web/src/locationSearch.ts and MapPage.tsx's LocationSearch.
  -->
  <link rel="stylesheet" href="leaflet/leaflet.css" />
  <style>
    /* Inter from the app's own resources (res/font, served by WebViewAssetLoader at /res/). */
    @font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url("/res/font/inter_regular.ttf"); }
    @font-face { font-family: "Inter"; font-weight: 600; font-display: swap; src: url("/res/font/inter_semibold.ttf"); }
    @font-face { font-family: "Inter"; font-weight: 700; font-display: swap; src: url("/res/font/inter_bold.ttf"); }
    :root {
      --chrome-top: 0px;
      --chrome-bottom: 0px;
      --page: #EEE9DC;
      --surface: #FFFDF8;
      --border: #E4DDCC;
      --border-strong: #CFC5AE;
      --text: #1E261C;
      --text-2: #4B5446;
      --text-3: #696A5B;
      --brand: #2F5D3A;
      --shadow: 0 1px 2px rgba(60, 50, 30, .12), 0 2px 6px rgba(60, 50, 30, .10);
    }
    body.dark {
      --page: #0E110C;
      --surface: #1A1E17;
      --border: #2D3327;
      --border-strong: #3D4536;
      --text: #EDEBE3;
      --text-2: #C0BEB1;
      --text-3: #9A9889;
      --brand: #9CCB82;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 2px 6px rgba(0, 0, 0, .3);
    }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--page);
      font-family: Inter, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .leaflet-container { background: var(--page); font-family: inherit; }
    .leaflet-top { padding-top: var(--chrome-top); }
    .leaflet-bottom { padding-bottom: var(--chrome-bottom); transition: padding-bottom 0s; }
    .cg-heat { pointer-events: none; }

    /* Controls: surface buttons with a border, 48px touch targets. The .leaflet-touch prefix beats
       leaflet.css's own touch rules (30px, 22px font), which otherwise win on a phone. */
    .leaflet-bar, .leaflet-touch .leaflet-bar { border: 1px solid var(--border-strong); box-shadow: var(--shadow); border-radius: 10px; }
    .leaflet-bar a, .leaflet-bar a:hover { background: var(--surface); color: var(--text); border-bottom-color: var(--border); }
    .leaflet-touch .leaflet-bar a, .leaflet-touch .leaflet-bar a:hover { width: 48px; height: 48px; line-height: 48px; }
    .leaflet-touch .leaflet-control-zoom .leaflet-control-zoom-in,
    .leaflet-touch .leaflet-control-zoom .leaflet-control-zoom-out { font-size: 26px; font-weight: 400; }
    .leaflet-touch .leaflet-bar a:first-child { border-top-left-radius: 10px; border-top-right-radius: 10px; }
    .leaflet-touch .leaflet-bar a:last-child { border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; }
    .leaflet-bar a:focus { background: var(--surface); color: var(--text); }
    .leaflet-bar a.leaflet-disabled { background: var(--surface); color: var(--text-3); opacity: .6; }
    .leaflet-container .leaflet-control-attribution { background: var(--surface); color: var(--text-2); font-size: 10px; opacity: .92; }
    .leaflet-container .leaflet-control-attribution a { color: var(--text-2); }
    .leaflet-bar a.basemap-toggle { display: flex; align-items: center; justify-content: center; }
    .leaflet-touch .leaflet-bar a.basemap-toggle { border-radius: 10px; }
    .basemap-toggle svg { width: 24px; height: 24px; display: block; }

    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    .leaflet-popup-content-wrapper { border-radius: 12px; border: 1px solid var(--border); }
    .leaflet-popup-content { font-size: 13px; line-height: 1.4; }
    .popup-title { font-weight: 700; font-size: 15px; color: var(--brand); }
    .popup-meta { color: var(--text-2); }
    .popup-note { color: var(--text-3); font-size: 12px; margin-top: 8px; }
    .popup-rule { border: 0; border-top: 1px solid var(--border); margin: 8px 0; }

    /* Legend (bottom-right): collapsed by default, tap to expand. */
    .legend {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 8px 10px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      max-width: 220px;
    }
    .legend h4 { margin: 0 0 6px 0; font-size: 12px; font-weight: 600; }
    .legend .legend-toggle { display: none; margin: 0; }
    .legend.collapsed .legend-body { display: none; }
    .legend.collapsed .legend-toggle { display: block; }
    .legend-row { display: flex; align-items: center; gap: 8px; white-space: nowrap; line-height: 20px; margin-top: 4px; }
    .legend-ramp { position: relative; height: 12px; border-radius: 3px; margin: 2px 0 0 0; width: 190px; }
    .legend-ticks { position: relative; height: 30px; width: 190px; color: var(--text-2); font-size: 11px; }
    .legend-ticks span { position: absolute; top: 2px; transform: translateX(-50%); white-space: nowrap; text-align: center; line-height: 13px; }
    .legend-ticks span::before {
      content: ""; position: absolute; left: 50%; top: -8px; width: 1px; height: 6px; background: var(--text);
    }
    .legend-ticks span.edge-left { transform: none; }
    .legend-ticks span.edge-left::before { display: none; }
    .legend-ticks span.edge-right { transform: translateX(-100%); text-align: right; }
    .legend-ticks span.edge-right::before { display: none; }
    .swatch { width: 16px; height: 16px; flex: none; display: block; border-radius: 3px; }
    .swatch-hatch { border: 1px dashed var(--text-3); box-sizing: border-box; }
    .legend-note { color: var(--text-3); margin-top: 6px; white-space: normal; line-height: 15px; }

    /* Location search. Its corner stacks above the bottom corners so results draw over the legend. */
    .leaflet-top.leaflet-left { z-index: 1001; }
    body.searching .legend,
    body.searching .leaflet-control-zoom,
    body.searching .basemap-control,
    body.searching .leaflet-control-attribution { display: none; }
    .search { width: calc(100vw - 24px); max-width: 320px; font-size: 13px; }
    .search.collapsed { width: auto; }
    .search.collapsed .search-box,
    .search.collapsed .search-results,
    .search:not(.collapsed) .search-toggle { display: none; }
    .search-toggle, .search-box, .search-results {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: var(--shadow);
      color: var(--text);
    }
    .search-toggle { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; padding: 0; }
    .search-toggle svg { width: 22px; height: 22px; }
    .search-box { display: flex; align-items: center; }
    .search-box:focus-within { border-color: var(--brand); }
    .search-box input {
      flex: 1; min-width: 0; padding: 10px 12px; background: transparent; border: none; outline: none;
      color: var(--text); font: inherit; font-size: 16px; /* 16px+ so the WebView doesn't zoom in on focus */
    }
    .search-box input::placeholder { color: var(--text-3); }
    .search-clear { flex: none; width: 44px; height: 44px; background: none; border: none; color: var(--text-2); font-size: 22px; line-height: 1; }
    .search-results { margin: 4px 0 0 0; padding: 4px 0; list-style: none; max-height: 40vh; overflow-y: auto; }
    .search-results li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; }
    .search-results li:active { background: var(--page); }
    .search-name { font-weight: 600; }
    .search-meta { color: var(--text-2); text-align: right; }
    .search-results li.search-empty { color: var(--text-2); }
    button:focus { outline: none; }
    button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="leaflet/leaflet.js"></script>
  <script>
    const chrome = { top: 0, bottom: 0 };
    let geoJsonLayer = null;
    const barangayLayers = [];
    let latestStats = [];
    // My Farms: the signed-in farmer's own farm pins (private; only their app receives them).
    let latestFarms = [];
    let farmLayer = null;
    let dark = false;
    // '' = all diseases, otherwise one disease code (the sheet's pills).
    let diseaseFilter = '';
    let selectedLayer = null;

    // ---- Palette ("earth" v2; same values as values/colors.xml and admin.css §1) ----
    const RAMP = {
      light: [[0, '#EFDCA0'], [0.25, '#E3B85A'], [0.5, '#D08A26'], [0.8, '#B04F27'], [1, '#7A2417']],
      dark: [[0, '#6B5226'], [0.25, '#A06C24'], [0.5, '#D08B33'], [0.8, '#F2A37F'], [1, '#FCD3C2']]
    };
    const HATCH = { light: { line: '#A39A85', bg: '#F4EFE2' }, dark: { line: '#7D7B6D', bg: '#1D2219' } };
    const OUTLINE = { light: '#CFC5AE', dark: '#3D4536' };
    const SELECTED = { light: '#1E261C', dark: '#EDEBE3' };
    const BRAND = { light: '#2F5D3A', dark: '#8DBF72' };
    function theme() { return dark ? 'dark' : 'light'; }

    function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function rgbToHex(c) { return '#' + c.map((v) => Math.round(v).toString(16).padStart(2, '0')).join(''); }
    function rampColor(t) {
      const stops = RAMP[theme()];
      const x = Math.min(1, Math.max(0, t));
      for (let i = 1; i < stops.length; i++) {
        if (x <= stops[i][0]) {
          const [a, ca] = stops[i - 1];
          const [b, cb] = stops[i];
          const f = (x - a) / (b - a);
          const A = hexToRgb(ca), B = hexToRgb(cb);
          return rgbToHex(A.map((v, k) => v + (B[k] - v) * f));
        }
      }
      return stops[stops.length - 1][1];
    }
    // Outline 25% darker than the fill (25% lighter in dark mode, where the ramp gets lighter).
    function strokeFor(fill) {
      const c = hexToRgb(fill);
      return rgbToHex(dark ? c.map((v) => v + (255 - v) * 0.25) : c.map((v) => v * 0.75));
    }

    // Fixed-scale heat for one stat row. Uses the backend's value; the formula below is a fallback
    // for older backends. KEEP IN SYNC with heatIntensity in backend/convex/lib/outbreakRules.ts.
    function heatOf(s) {
      if (s.intensity !== undefined) return s.intensity;
      if (s.monitoringStatus === 'collecting') return null;
      const farms = Math.max(0, s.distinctFarms || 0);
      if (farms === 0) return 0;
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const moderateAt = Math.max(1, s.moderateAt != null ? s.moderateAt : 3);
      const severeAt = Math.max(moderateAt + 1, s.severeAt != null ? s.severeAt : 5);
      if (s.severityTier === 'severe') return 0.8 + 0.2 * clamp01((farms - severeAt) / severeAt);
      if (s.severityTier === 'moderate') return 0.5 + 0.28 * clamp01((farms - moderateAt) / (severeAt - moderateAt));
      return Math.min(0.45, 0.12 + 0.33 * farms / moderateAt);
    }

    function areaKey(barangay, municipality) { return barangay + '||' + municipality; }

    // { heat } for the hottest matching disease, { collecting: true } when only collecting rows
    // match, or null (no reports this week).
    let areaState = {};
    function computeAreaState() {
      areaState = {};
      latestStats.forEach((s) => {
        if (diseaseFilter && s.diseaseCode !== diseaseFilter) return;
        const key = areaKey(s.barangay, s.municipality);
        const h = heatOf(s);
        const st = areaState[key] || (areaState[key] = { heat: null, collecting: false });
        if (h === null) st.collecting = true;
        else if (h > 0 && (st.heat === null || h > st.heat)) st.heat = h;
      });
    }
    function stateOf(layer) {
      const p = layer.feature.properties;
      const st = areaState[areaKey(p.barangay, p.municipality)];
      if (!st) return null;
      if (st.heat !== null) return { heat: st.heat };
      return st.collecting ? { collecting: true } : null;
    }

    // ---- Map ----
    // Canvas renderer: one <canvas> for 464 polygons instead of 464 SVG paths.
    const MAX_ZOOM = 16;
    const map = L.map('map', { zoomControl: false, preferCanvas: true, maxZoom: MAX_ZOOM }).setView([8.15, 125.13], 9);
    L.control.zoom({ position: 'topleft' }).addTo(map);
    map.createPane('heatPane').style.zIndex = 350; // under the polygons (overlayPane, 400)
    map.attributionControl.setPrefix(false);
    map.attributionControl.addAttribution('<a href="https://leafletjs.com">Leaflet</a> | Boundaries &copy; NAMRIA, PSA');

    function setMapChrome(top, bottom) {
      chrome.top = top || 0;
      chrome.bottom = bottom || 0;
      applyChrome();
      fitToLayer(true);
    }
    function applyChrome() {
      const root = document.documentElement.style;
      root.setProperty('--chrome-top', chrome.top + 'px');
      root.setProperty('--chrome-bottom', chrome.bottom + 'px');
      // Popups pan clear of the app's top controls and the bottom sheet.
      L.Popup.prototype.options.autoPanPaddingTopLeft = L.point(10, chrome.top + 10);
      L.Popup.prototype.options.autoPanPaddingBottomRight = L.point(10, chrome.bottom + 10);
    }
    window.setMapChrome = setMapChrome;

    // Called while the sheet is dragged (CSS px = dp). Moves the legend/attribution with the sheet
    // and pans by half the change, so the point at the centre of the visible map stays put.
    let pendingInset = null;
    window.setBottomInset = function (px) {
      pendingInset = Math.max(0, Math.round(px || 0));
      if (!window.__insetFrame) {
        window.__insetFrame = requestAnimationFrame(() => {
          window.__insetFrame = null;
          const delta = pendingInset - chrome.bottom;
          if (delta === 0) return;
          chrome.bottom = pendingInset;
          applyChrome();
          map.panBy([0, delta / 2], { animate: false });
        });
      }
    };

    window.setTheme = function (isDark) {
      dark = !!isDark;
      document.body.classList.toggle('dark', dark);
      restyleAll();
      heatLayer.redraw();
      renderFarms();
      buildLegend();
    };

    window.setDiseaseFilter = function (code) {
      diseaseFilter = code || '';
      render();
    };

    // Fitting all of Bukidnon on a phone lands around zoom 8; never open wider than the initial view.
    const FIT_MIN_ZOOM = 9;
    let hasFitted = false;
    function fitToLayer(force) {
      if (!geoJsonLayer) return;
      if (hasFitted && !force) return;
      const bounds = geoJsonLayer.getBounds();
      if (!bounds.isValid()) return;
      const paddingTL = L.point(16, chrome.top + 16);
      const paddingBR = L.point(16, chrome.bottom + 16);
      const zoom = Math.max(FIT_MIN_ZOOM, map.getBoundsZoom(bounds, false, paddingTL.add(paddingBR)));
      const offset = paddingBR.subtract(paddingTL).divideBy(2);
      const center = map.unproject(
        map.project(bounds.getSouthWest(), zoom).add(map.project(bounds.getNorthEast(), zoom))
          .divideBy(2).add(offset),
        zoom
      );
      map.setView(center, zoom, { animate: false });
      hasFitted = true;
    }

    // ---- Basemap ----
    // Street tiles only from TILE_MIN_ZOOM (barangay scale): the province view needs nothing but the
    // bundled boundaries, so it costs no tile requests (OSM's tile policy forbids heavy use).
    // Satellite is the farmer's explicit choice and loads at every zoom.
    // KEEP IN SYNC with BasemapToggle / SATELLITE_* in admin-web/src/pages/MapPage.tsx.
    const TILE_MIN_ZOOM = 12;
    const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: MAX_ZOOM
    });
    const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
    const satelliteLayer = L.layerGroup([
      L.tileLayer(ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
        maxNativeZoom: 16,
        maxZoom: MAX_ZOOM
      }),
      L.tileLayer(ESRI + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
        maxNativeZoom: 16,
        maxZoom: MAX_ZOOM
      })
    ]);
    const BASEMAP_KEY = 'cg.basemap';
    let currentBasemap = 'map';
    try {
      if (localStorage.getItem(BASEMAP_KEY) === 'satellite') currentBasemap = 'satellite';
    } catch (e) { /* storage unavailable: stay on Map */ }

    function syncTiles() {
      const wantStreet = currentBasemap === 'map' && map.getZoom() >= TILE_MIN_ZOOM;
      const wantSatellite = currentBasemap === 'satellite';
      if (wantStreet !== map.hasLayer(streetLayer)) {
        if (wantStreet) streetLayer.addTo(map); else map.removeLayer(streetLayer);
        if (geoJsonLayer) restyleAll();
      }
      if (wantSatellite !== map.hasLayer(satelliteLayer)) {
        if (wantSatellite) satelliteLayer.addTo(map); else map.removeLayer(satelliteLayer);
      }
    }
    map.on('zoomend', syncTiles);

    let basemapButton = null;
    function setBasemap(name) {
      if (name === currentBasemap) return;
      currentBasemap = name;
      syncTiles();
      restyleAll();
      updateBasemapButton();
      try { localStorage.setItem(BASEMAP_KEY, name); } catch (e) { /* not remembered; fine */ }
    }
    // Icons from Lucide (ISC licence): "satellite" and "map".
    const SVG_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
    const BASEMAP_ICON = {
      Satellite: SVG_OPEN + '<path d="M13 7 9 3 5 7l4 4"/><path d="m17 11 4 4-4 4-4-4"/>' +
        '<path d="m8 12 4 4 6-6-4-4Z"/><path d="m16 8 3-3"/><path d="M9 21a6 6 0 0 0-6-6"/></svg>',
      Map: SVG_OPEN + '<path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894' +
        'l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618' +
        'a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg>'
    };
    function updateBasemapButton() {
      if (!basemapButton) return;
      const next = currentBasemap === 'satellite' ? 'Map' : 'Satellite';
      basemapButton.innerHTML = BASEMAP_ICON[next];
      basemapButton.title = 'Show ' + next.toLowerCase() + ' view';
      basemapButton.setAttribute('aria-label', basemapButton.title);
    }
    const basemapControl = L.control({ position: 'bottomleft' });
    basemapControl.onAdd = function () {
      const bar = L.DomUtil.create('div', 'leaflet-bar basemap-control');
      basemapButton = L.DomUtil.create('a', 'basemap-toggle', bar);
      basemapButton.href = '#';
      basemapButton.setAttribute('role', 'button');
      L.DomEvent.disableClickPropagation(bar);
      L.DomEvent.on(basemapButton, 'click', (e) => {
        L.DomEvent.preventDefault(e);
        setBasemap(currentBasemap === 'satellite' ? 'map' : 'satellite');
      });
      updateBasemapButton();
      return bar;
    };
    basemapControl.addTo(map);

    // ---- Barangay polygons: heat fill, outline, selection ----
    const HEAT_FILL_OPACITY = 0.78;
    const HIGHLIGHT_COLOR = { light: '#2F5D80', dark: '#8FB8DA' }; // municipality search (info blue)
    function styleFor(layer) {
      const st = stateOf(layer);
      const satellite = currentBasemap === 'satellite';
      let style;
      if (st && st.heat !== undefined) {
        const fill = rampColor(st.heat);
        style = { fill: true, fillColor: fill, fillOpacity: HEAT_FILL_OPACITY, color: strokeFor(fill), opacity: 1, weight: 1 };
      } else if (st && st.collecting) {
        // Hatching is drawn by the heat layer underneath; the polygon adds the dashed outline.
        style = { fill: true, fillOpacity: 0, color: HATCH[theme()].line, opacity: 1, weight: 1, dashArray: '4 3' };
      } else {
        // fill stays on (transparent) so the whole barangay is tappable. Over street tiles the
        // outline needs more weight to stay readable.
        const onTiles = map.hasLayer(streetLayer);
        style = satellite
          ? { fill: true, fillOpacity: 0, color: '#F6F3EA', opacity: 0.8, weight: 1.2 }
          : { fill: true, fillOpacity: 0, color: onTiles ? '#5B5F52' : OUTLINE[theme()], opacity: onTiles ? 0.7 : 1, weight: onTiles ? 1.2 : 0.8 };
      }
      if (highlightedLayers.includes(layer)) {
        style = Object.assign({}, style, { color: HIGHLIGHT_COLOR[theme()], weight: 2.5, dashArray: null });
      }
      if (layer === selectedLayer) {
        style = Object.assign({}, style, { color: SELECTED[theme()], weight: 2.5, opacity: 1, dashArray: null });
      }
      return style;
    }
    function restyleAll() {
      barangayLayers.forEach((layer) => layer.setStyle(styleFor(layer)));
      if (selectedLayer) selectedLayer.bringToFront();
    }

    function selectLayer(layer, notify) {
      const previous = selectedLayer;
      selectedLayer = layer;
      if (previous) previous.setStyle(styleFor(previous));
      if (layer) {
        layer.setStyle(styleFor(layer));
        layer.bringToFront();
      }
      if (notify && layer && window.CornGuardMap && window.CornGuardMap.onAreaSelected) {
        const p = layer.feature.properties;
        window.CornGuardMap.onAreaSelected(JSON.stringify({ barangay: p.barangay, municipality: p.municipality }));
      }
    }

    /** From MapFragment: select the farmer's barangay (fly = also bring it into view). */
    window.selectArea = function (barangay, municipality, fly) {
      const layer = barangayLayers.find((l) =>
        l.feature.properties.barangay === barangay && l.feature.properties.municipality === municipality);
      if (!layer) return false;
      selectLayer(layer, false);
      if (fly) {
        map.flyToBounds(layer.getBounds(), {
          paddingTopLeft: [20, chrome.top + 20], paddingBottomRight: [20, chrome.bottom + 20], maxZoom: 13
        });
      }
      return true;
    };

    // ---- Heat layer: hatching for "collecting" barangays + centroid glow (custom canvas) ----
    // Glows are drawn opaque in ascending heat order on an offscreen canvas (so where they overlap
    // the hotter one wins — a maximum, never a sum), then blurred onto the map in one pass.
    // Radii from the design (px with the whole province ~600px wide, i.e. zoom 10); they grow
    // half as fast as the map so the glow stays a hint around the barangay, not a new area.
    const GLOW_RADIUS = { severe: 44, moderate: 34, mild: 24 };
    const GLOW_REFERENCE_ZOOM = 10;
    const GLOW_BLUR = 9;
    const GLOW_ALPHA = 0.4;
    function glowRadius(heat) {
      const base = heat >= 0.8 ? GLOW_RADIUS.severe : heat >= 0.5 ? GLOW_RADIUS.moderate : GLOW_RADIUS.mild;
      return base * Math.min(1.6, Math.pow(2, (map.getZoom() - GLOW_REFERENCE_ZOOM) / 2));
    }
    const HeatLayer = L.Layer.extend({
      onAdd: function (m) {
        this._canvas = L.DomUtil.create('canvas', 'cg-heat');
        this._glow = document.createElement('canvas');
        m.getPane('heatPane').appendChild(this._canvas);
        m.on('moveend zoomend resize viewreset', this._reset, this);
        m.on('zoomstart', this._hide, this);
        this._reset();
      },
      onRemove: function (m) {
        L.DomUtil.remove(this._canvas);
        m.off('moveend zoomend resize viewreset', this._reset, this);
        m.off('zoomstart', this._hide, this);
      },
      redraw: function () { if (this._map) this._reset(); },
      _hide: function () { this._canvas.style.visibility = 'hidden'; },
      _reset: function () {
        const m = this._map;
        const size = m.getSize();
        const ratio = window.devicePixelRatio || 1;
        const w = Math.round(size.x * ratio), h = Math.round(size.y * ratio);
        if (this._canvas.width !== w || this._canvas.height !== h) {
          [this._canvas, this._glow].forEach((c) => { c.width = w; c.height = h; });
          this._canvas.style.width = size.x + 'px';
          this._canvas.style.height = size.y + 'px';
        }
        L.DomUtil.setPosition(this._canvas, m.containerPointToLayerPoint([0, 0]));
        this._draw(ratio);
        this._canvas.style.visibility = 'visible';
      },
      _draw: function (ratio) {
        const m = this._map;
        const ctx = this._canvas.getContext('2d');
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        ctx.clearRect(0, 0, this._canvas.width, this._canvas.height);
        if (!geoJsonLayer) return;
        const viewBounds = m.getBounds().pad(0.2);
        const hot = [];
        const hatch = HATCH[theme()];
        let pattern = null;
        barangayLayers.forEach((layer) => {
          const st = stateOf(layer);
          if (!st || !viewBounds.intersects(layer.getBounds())) return;
          if (st.heat !== undefined) { hot.push({ layer: layer, heat: st.heat }); return; }
          // Collecting: diagonal hatch inside the polygon.
          if (!pattern) pattern = ctx.createPattern(hatchTile(hatch, ratio), 'repeat');
          ctx.save();
          ctx.beginPath();
          traceLayer(ctx, m, layer);
          ctx.fillStyle = hatch.bg;
          ctx.globalAlpha = 0.85;
          ctx.fill('evenodd');
          ctx.globalAlpha = 1;
          ctx.setTransform(1, 0, 0, 1, 0, 0); // pattern in device pixels
          ctx.fillStyle = pattern;
          ctx.fill('evenodd');
          ctx.restore();
        });
        if (hot.length === 0) return;
        hot.sort((a, b) => a.heat - b.heat);
        const g = this._glow.getContext('2d');
        g.setTransform(ratio, 0, 0, ratio, 0, 0);
        g.clearRect(0, 0, this._glow.width, this._glow.height);
        hot.forEach((h) => {
          const c = m.latLngToContainerPoint(centroidOf(h.layer));
          g.beginPath();
          g.arc(c.x, c.y, glowRadius(h.heat), 0, Math.PI * 2);
          g.fillStyle = rampColor(h.heat);
          g.fill();
        });
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = GLOW_ALPHA;
        ctx.filter = 'blur(' + Math.round(GLOW_BLUR * ratio) + 'px)';
        ctx.drawImage(this._glow, 0, 0);
        ctx.restore();
      }
    });
    function hatchTile(hatch, ratio) {
      const s = Math.round(8 * ratio);
      const c = document.createElement('canvas');
      c.width = c.height = s;
      const x = c.getContext('2d');
      x.strokeStyle = hatch.line;
      x.lineWidth = Math.max(1, ratio);
      x.beginPath();
      x.moveTo(0, s); x.lineTo(s, 0);
      x.moveTo(-s / 2, s / 2); x.lineTo(s / 2, -s / 2);
      x.moveTo(s / 2, s * 1.5); x.lineTo(s * 1.5, s / 2);
      x.stroke();
      return c;
    }
    // Rings of a Polygon / MultiPolygon layer, in container pixels.
    function traceLayer(ctx, m, layer) {
      const rings = [];
      const collect = (latlngs) => {
        if (latlngs.length && latlngs[0] instanceof L.LatLng) rings.push(latlngs);
        else latlngs.forEach(collect);
      };
      collect(layer.getLatLngs());
      rings.forEach((ring) => {
        ring.forEach((ll, i) => {
          const p = m.latLngToContainerPoint(ll);
          if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        });
        ctx.closePath();
      });
    }
    function centroidOf(layer) {
      if (!layer._cgCenter) {
        try { layer._cgCenter = layer.getCenter(); } catch (e) { layer._cgCenter = layer.getBounds().getCenter(); }
      }
      return layer._cgCenter;
    }
    const heatLayer = new HeatLayer();
    heatLayer.addTo(map);

    // ---- Farms ----
    /** Map pin with a small house: the farmer's own farm (My Farms), not a disease report. */
    function farmSvg(width) {
      const height = Math.round(width * 46 / 36);
      const fill = BRAND[theme()];
      const inner = dark ? '#10210C' : '#FFFFFF';
      return `<svg width="${width}" height="${height}" viewBox="0 0 36 46" xmlns="http://www.w3.org/2000/svg">` +
        `<path d="M18 45C18 45 3 27.5 3 17A15 15 0 0 1 33 17C33 27.5 18 45 18 45Z" fill="${fill}" stroke="${inner}" stroke-width="2.5"/>` +
        `<path d="M10.5 18.5L18 12l7.5 6.5V25h-5v-4.5h-5V25h-5z" fill="${inner}"/></svg>`;
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function farmPopupHtml(farm) {
      return `<div style="min-width:180px">
        <div class="popup-title">Your farm: ${escapeHtml(farm.name)}</div>
        <div class="popup-meta">${escapeHtml(farm.barangay)}, ${escapeHtml(farm.municipality)}</div>
        <div class="popup-note">Only you can see this farm.</div>
      </div>`;
    }
    function renderFarms() {
      if (farmLayer) map.removeLayer(farmLayer);
      farmLayer = L.layerGroup();
      const icon = L.divIcon({ className: '', iconSize: [30, 38], iconAnchor: [15, 37], popupAnchor: [0, -34], html: farmSvg(30) });
      latestFarms.forEach((farm) => {
        if (farm.latitude == null || farm.longitude == null) return;
        L.marker([farm.latitude, farm.longitude], { icon, zIndexOffset: 1000, keyboard: false })
          .bindPopup(() => farmPopupHtml(farm))
          .addTo(farmLayer);
      });
      farmLayer.addTo(map);
    }

    // ---- Legend ----
    const legend = L.control({ position: 'bottomright' });
    let legendDiv = null;
    function buildLegend() {
      if (!legendDiv) return;
      const stops = RAMP[theme()].map(([t, c]) => `${c} ${t * 100}%`).join(', ');
      const hatch = HATCH[theme()];
      const hatchCss = `background: repeating-linear-gradient(135deg, ${hatch.line} 0 1px, ${hatch.bg} 1px 5px)`;
      legendDiv.innerHTML = `
        <h4 class="legend-toggle">Legend &#9656;</h4>
        <div class="legend-body">
          <h4>Outbreak level · last 7 days</h4>
          <div class="legend-ramp" style="background: linear-gradient(90deg, ${stops})"></div>
          <div class="legend-ticks">
            <span class="edge-left" style="left:0">Mild</span>
            <span style="left:50%">Moderate<br>2×</span>
            <span style="left:80%">Severe<br>3×</span>
          </div>
          <div class="legend-row"><span class="swatch swatch-hatch" style="${hatchCss}"></span>Not enough data yet</div>
          <div class="legend-row"><span class="swatch" style="border-radius:0">${farmSvg(14)}</span>Your farm (only you see it)</div>
          <div class="legend-note">Colour = the whole barangay compared with its usual level, not where farms are.</div>
        </div>`;
    }
    legend.onAdd = function () {
      legendDiv = L.DomUtil.create('div', 'legend collapsed');
      legendDiv.setAttribute('role', 'button');
      legendDiv.setAttribute('aria-label', 'Map legend');
      buildLegend();
      L.DomEvent.disableClickPropagation(legendDiv);
      legendDiv.addEventListener('click', () => legendDiv.classList.toggle('collapsed'));
      return legendDiv;
    };
    legend.addTo(map);

    // Build the 464 barangay outlines once; only their styles change on updates.
    function ensurePolygons() {
      if (geoJsonLayer) return true;
      const barangays = window.BARANGAYS_GEOJSON;
      if (!barangays) return false;
      geoJsonLayer = L.geoJSON(barangays, {
        style: () => ({ fill: true, fillOpacity: 0, color: OUTLINE[theme()], weight: 0.8 }),
        onEachFeature: (feature, layer) => {
          barangayLayers.push(layer);
          layer.on('click', () => selectLayer(layer, true));
        }
      }).addTo(map);
      buildSearchIndex();
      return true;
    }

    // ---- Location search ----
    // Searches only the bundled boundary file: every barangay plus every municipality derived
    // from it, so it can never offer a place the map has no outline for.
    // KEEP IN SYNC with admin-web/src/locationSearch.ts (matching) and MapPage.tsx (behaviour).
    const NO_LOCATION_MESSAGE =
      'Location not available — only barangays and municipalities in Bukidnon can be searched.';
    const SEARCH_LIMIT = 12;
    const KEYBOARD_CLOSE_MS = 800;
    let fullHeight = window.innerHeight;
    window.addEventListener('resize', () => { fullHeight = Math.max(fullHeight, window.innerHeight); });

    function whenKeyboardClosed(fn) {
      const isFull = () => window.innerHeight >= fullHeight * 0.9;
      if (isFull()) { fn(); return; }
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        window.removeEventListener('resize', onResize);
        fn();
      };
      const onResize = () => { if (isFull()) finish(); };
      window.addEventListener('resize', onResize);
      setTimeout(finish, KEYBOARD_CLOSE_MS);
    }
    let searchIndex = [];
    let highlightedLayers = [];

    function normalizeName(s) {
      return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
    }

    function buildSearchIndex() {
      const byKey = {};
      searchIndex = [];
      const add = (barangay, municipality, layer) => {
        const key = (barangay || '') + '||' + municipality;
        if (!byKey[key]) {
          const name = barangay || municipality;
          byKey[key] = {
            kind: barangay ? 'barangay' : 'municipality',
            barangay: barangay,
            municipality: municipality,
            label: name,
            name: normalizeName(name),
            shortName: normalizeName(name.replace(/^city of /i, '').replace(/\(.*?\)/g, '')),
            full: normalizeName(barangay ? barangay + ' ' + municipality : municipality),
            layers: []
          };
          searchIndex.push(byKey[key]);
        }
        byKey[key].layers.push(layer);
      };
      barangayLayers.forEach((layer) => {
        const p = layer.feature.properties;
        if (!p.municipality) return;
        add(null, p.municipality, layer);
        if (p.barangay) add(p.barangay, p.municipality, layer);
      });
    }

    function matchRank(entry, q) {
      const names = [entry.name, entry.shortName];
      if (names.some((n) => n === q)) return 0;
      if (names.some((n) => n.startsWith(q))) return 1;
      if (entry.name.split(' ').some((word) => word.startsWith(q))) return 2;
      if (entry.name.includes(q)) return 3;
      if (q.split(' ').every((word) => entry.full.includes(word))) return 4;
      return null;
    }

    function searchLocations(query) {
      const q = normalizeName(query);
      if (!q) return [];
      return searchIndex
        .map((entry) => ({ entry: entry, rank: matchRank(entry, q) }))
        .filter((m) => m.rank !== null)
        .sort((a, b) =>
          a.rank - b.rank ||
          (a.entry.kind === b.entry.kind ? 0 : a.entry.kind === 'municipality' ? -1 : 1) ||
          a.entry.label.localeCompare(b.entry.label) ||
          a.entry.municipality.localeCompare(b.entry.municipality))
        .slice(0, SEARCH_LIMIT)
        .map((m) => m.entry);
    }

    function clearHighlight() {
      const old = highlightedLayers;
      highlightedLayers = [];
      old.forEach((layer) => layer.setStyle(styleFor(layer)));
    }

    function selectLocation(entry) {
      clearHighlight();
      const bounds = L.latLngBounds([]);
      entry.layers.forEach((layer) => bounds.extend(layer.getBounds()));
      map.closePopup();
      if (entry.kind === 'barangay') {
        // A barangay is selected like a tap on it: the sheet shows its level.
        selectLayer(entry.layers[0], true);
      } else {
        highlightedLayers = entry.layers.slice();
        highlightedLayers.forEach((layer) => { layer.setStyle(styleFor(layer)); layer.bringToFront(); });
      }
      map.flyToBounds(bounds, {
        paddingTopLeft: [20, chrome.top + 70],
        paddingBottomRight: [20, chrome.bottom + 20],
        maxZoom: 14
      });
    }

    const searchControl = L.control({ position: 'topleft' });
    searchControl.onAdd = function () {
      const div = L.DomUtil.create('div', 'search collapsed');
      div.innerHTML =
        '<button type="button" class="search-toggle" aria-label="Search barangay or municipality">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"' +
        ' aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>' +
        '</button>' +
        '<div class="search-box">' +
        '<input type="text" placeholder="Search barangay or municipality"' +
        ' aria-label="Search barangay or municipality" autocomplete="off" enterkeyhint="search" />' +
        '<button type="button" class="search-clear" aria-label="Close search">&times;</button>' +
        '</div>' +
        '<ul class="search-results" role="listbox" hidden></ul>';
      const toggleButton = div.querySelector('.search-toggle');
      const input = div.querySelector('input');
      const clearButton = div.querySelector('.search-clear');
      const list = div.querySelector('.search-results');
      let results = [];

      function expand() {
        div.classList.remove('collapsed');
        input.focus();
      }
      function collapse() {
        clear();
        input.blur();
        div.classList.add('collapsed');
      }
      function showResults() {
        list.innerHTML = '';
        if (!input.value.trim()) {
          list.hidden = true;
          return;
        }
        results = searchLocations(input.value);
        if (results.length === 0) {
          const li = document.createElement('li');
          li.className = 'search-empty';
          li.textContent = NO_LOCATION_MESSAGE;
          list.appendChild(li);
        }
        results.forEach((entry) => {
          const li = document.createElement('li');
          li.setAttribute('role', 'option');
          const name = document.createElement('span');
          name.className = 'search-name';
          name.textContent = entry.label;
          const meta = document.createElement('span');
          meta.className = 'search-meta';
          meta.textContent = entry.kind === 'municipality' ? 'Municipality' : entry.municipality;
          li.appendChild(name);
          li.appendChild(meta);
          li.addEventListener('click', () => choose(entry));
          list.appendChild(li);
        });
        list.hidden = false;
      }
      function choose(entry) {
        input.value = entry.kind === 'barangay' ? entry.label + ', ' + entry.municipality : entry.label;
        list.hidden = true;
        if (legendDiv) legendDiv.classList.add('collapsed');
        // Close the soft keyboard first: the app's window resizes for it, so fly only once the
        // map is back to full height, or the area ends up off-centre and under-zoomed.
        input.blur();
        whenKeyboardClosed(() => {
          map.invalidateSize({ pan: false });
          selectLocation(entry);
        });
      }
      function clear() {
        clearHighlight();
        map.closePopup();
        input.value = '';
        showResults();
      }

      input.addEventListener('input', showResults);
      input.addEventListener('focus', () => {
        document.body.classList.add('searching');
        showResults();
      });
      input.addEventListener('blur', () => {
        document.body.classList.remove('searching');
        if (!input.value.trim()) div.classList.add('collapsed');
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (results.length > 0 && input.value.trim()) choose(results[0]);
        } else if (e.key === 'Escape') {
          collapse();
        }
      });
      toggleButton.addEventListener('click', expand);
      clearButton.addEventListener('click', collapse);
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      L.DomEvent.on(div, 'keydown keyup keypress', L.DomEvent.stopPropagation);
      map.on('click dragstart', () => { list.hidden = true; });
      return div;
    };
    searchControl.addTo(map);

    function render() {
      if (!ensurePolygons()) return;
      computeAreaState();
      restyleAll();
      heatLayer.redraw();
      fitToLayer();
    }

    /** Called by MapFragment with { stats?, farms? }; missing keys keep their last value. */
    window.updateMapData = function (payload) {
      try {
        if (!payload) return;
        if (payload.stats) latestStats = payload.stats;
        if (payload.farms) latestFarms = payload.farms;
        render();
        if (payload.farms) renderFarms();
      } catch (e) {
        console.error('Error updating map data: ' + e);
      }
    };

    syncTiles();

    // Load the Bukidnon barangay boundaries bundled with the app, then report ready.
    fetch('../geo/bukidnon-barangays.json')
      .then((r) => r.json())
      .then((geo) => {
        window.BARANGAYS_GEOJSON = geo;
        render();
        if (window.CornGuardMap) window.CornGuardMap.onReady();
      })
      .catch((e) => console.error('Could not load barangay boundaries: ' + e));
  </script>
</body>
</html>
