[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cornguard-ml"
version = "0.0.0"
description = "CornGuard corn-leaf disease classifier: training pipeline and shared code"
requires-python = ">=3.9,<3.13"  # tensorflow<2.17 has no build for 3.13+, see requirements.txt

# Runtime dependencies stay in requirements.txt (single source of truth).
# `pip install -e .` only makes `cornguard_ml` importable from anywhere.

[tool.setuptools]
packages = ["cornguard_ml", "pipeline"]
